org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# La compilation incrémentale de Kotlin échoue sous Windows sur les caches de
# certains plugins : « Could not close incremental caches [...] .tab », sur
# package_info_plus depuis l'ajout de wakelock_plus. Le démon n'arrive pas à
# relâcher ses fichiers de cache, et le build échoue systématiquement, y
# compris après un `flutter clean`.
#
# La désactiver ne coûte rien là où ça compte : la CI reconstruit de zéro à
# chaque fois, donc l'incrémental ne lui sert à rien. En local, un build
# complet vaut mieux qu'un build cassé.
kotlin.incremental=false
