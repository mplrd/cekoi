name: cekoi
description: "Jeu de société francophone inspiré de Time's Up : trois manches, le même paquet de cartes."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  # Les sons du jeu, joués depuis un asset sur le canal média.
  #
  # Et non `SystemSound.play`, qui a été un faux ami : sur Android il passe par
  # la couche de retour tactile, que l'interrupteur « sons des touches » éteint
  # — il l'est chez beaucoup de monde, et le tic n'a donc jamais sonné. Pire,
  # `SystemSoundType.alert` est documenté par Flutter comme **ignoré sur
  # Android et iOS** : le buzzer ne pouvait pas exister.
  audioplayers: ^6.8.1
  cupertino_icons: ^1.0.8

  # Base locale. sqlite3 3.x embarque lui-même les binaires natifs via les
  # build hooks de Dart : sqlite3_flutter_libs est en fin de vie et inutile.
  drift: ^2.34.0

  flutter:
    sdk: flutter
  flutter_file_dialog: ^3.3.2
  flutter_localizations:
    sdk: flutter

  # État — providers générés, jamais de constructeur manuel.
  # riverpod_annotation est épinglé en 4.0.3 parce que riverpod_generator 4.0.4
  # l'exige à l'identique. Voir la note des dev_dependencies.
  flutter_riverpod: ^3.3.0

  # Modèles immuables et unions scellées pour GameEvent.
  freezed_annotation: ^3.1.0

  go_router: ^17.4.0

  # Publicité, et le CMP Google UMP qu'il embarque — c'est lui qui évite
  # d'intégrer un CMP tiers pour le consentement européen. Exige minSdk 24 et
  # compileSdk 36, qui sont les défauts de Flutter : rien à forcer côté Gradle.
  google_mobile_ads: ^9.1.0

  # Version épinglée par flutter_localizations, ne pas desserrer.
  in_app_purchase: ^3.3.0
  intl: 0.20.2
  json_annotation: ^4.12.0
  # `@immutable` sur les objets de valeur écrits à la main, hors freezed.
  meta: ^1.18.0
  path: ^1.9.1
  path_provider: ^2.1.6
  riverpod_annotation: 4.0.3
  sqlite3: ^3.5.1

  # La vibration du buzzer. Même raison que pour le son : `HapticFeedback`
  # demande un retour tactile au système, que le réglage « vibration au
  # toucher » coupe. Le service Vibrator, lui, répond toujours.
  vibration: ^3.2.0
  wakelock_plus: ^1.7.0

dev_dependencies:
  build_runner: ^2.15.1

  # ATTENTION — ces quatre générateurs sont solidaires : ils doivent tourner
  # sur la MÊME version d'analyzer. La résolution actuelle est analyzer 12.
  #
  #   freezed 3.2.6-dev.1  analyzer >=12 <13
  #   riverpod_generator   analyzer ^12   (4.0.6+ passe à ^13)
  #   drift_dev 2.34.x     analyzer >=10 <13
  #   json_serializable    analyzer >=10 <15
  #
  # Il n'existe AUCUNE combinaison entièrement stable :
  #   - sur analyzer 13, drift_dev ne suit pas ;
  #   - sur analyzer 10, riverpod_generator stable n'existe pas ;
  #   - sur analyzer 9, json_serializable récent n'existe pas, et drift_dev
  #     y réclame sqlite3 2.x, donc le paquet natif en fin de vie.
  # D'où freezed en préversion, seule version couvrant analyzer 12. Le risque
  # est contenu : freezed est un générateur, pas une dépendance d'exécution.
  #
  # Ne jamais monter une seule de ces lignes : la résolution casse. À remonter
  # en bloc quand freezed 4 et drift_dev auront rejoint analyzer 13.
  drift_dev: ^2.34.0

  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter

  freezed: 3.2.6-dev.1
  json_serializable: ^6.13.2
  riverpod_generator: 4.0.4
  very_good_analysis: ^10.3.0

flutter:
  uses-material-design: true

  # Génère les classes de localisation à partir de lib/l10n/*.arb.
  generate: true

  assets:
    # Fabriqués par `python tool/make_sounds.py`, versionnés parce qu'ils sont
    # du contenu livré : le script est là pour les régler, pas pour les
    # produire au build.
    - assets/audio/
    - assets/decks/
    # Le seul fichier de marque que l'application lit : le dessin détouré, sans
    # son fond corail — il se pose ainsi sur le fond pastel de l'application au
    # lieu d'y coller un carré. Le SVG source, le PNG d'origine et le premier
    # plan des icônes vivent à côté mais restent hors du bundle : ils servent à
    # fabriquer, pas à exécuter, et pèsent plusieurs centaines de kilo-octets à
    # eux trois.
    - assets/branding/logo_mark.png

# Icônes de lanceur, générées depuis le logo par `dart run flutter_launcher_icons`.
#
# Le premier plan Android est fabriqué par `python tool/make_icons.py` : le
# dessin détouré, sur du transparent, sans son fond corail. Le fond uni reprend
# exactement le corail du logo, si bien que la jointure ne se voit pas.
#
# Sa marge est calculée sur le **rayon** du dessin, pas sur sa boîte : le
# système masque sur un cercle, et notre dessin remplit les coins de son carré.
# Le retrait de 16 % de `mipmap-anydpi-v26/ic_launcher.xml` n'est pas écrit à
# la main, c'est `adaptive_icon_foreground_inset` ci-dessous — épinglé pour que
# le calcul du script ne dépende pas d'un défaut de version. L'image atterrit
# donc sur 73,44 dp des 108 de la couche, et on vise la zone sûre documentée,
# un cercle de 66 dp, plutôt que le couperet du masque circulaire à 72 : entre
# les deux, ce qui reste visible dépend de la forme du masque du lanceur.
# `tool/test_geometrie_icones.py` verrouille les deux bouts de ce calcul.
#
# L'écran de démarrage d'Android 12, lui, consomme le drawable **brut** : il a
# donc son propre fichier, `splash_icon`, où le même script porte toute la
# marge — les deux tiers centraux en diamètre, soit un tiers du côté en rayon.
#
# Après tout passage de `flutter_launcher_icons`, remettre le saut de ligne
# final de `android/.../values/colors.xml`, qu'il retire au passage.
flutter_launcher_icons:
  image_path: assets/branding/logo.png
  android: true
  adaptive_icon_background: "#FA7567"
  adaptive_icon_foreground: assets/branding/logo_foreground.png
  # C'est la valeur par défaut du paquet, épinglée : `tool/make_icons.py` en
  # dérive la taille du canevas, et `tool/test_geometrie_icones.py` vérifie que
  # les deux disent la même chose.
  adaptive_icon_foreground_inset: 16
  ios: true
  remove_alpha_ios: true
