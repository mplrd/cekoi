name: cekoi
description: "Jeu de société francophone inspiré de Time's Up : trois manches, le même paquet de cartes."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  cupertino_icons: ^1.0.8

  # Base locale. sqlite3 3.x embarque lui-même les binaires natifs via les
  # build hooks de Dart : sqlite3_flutter_libs est en fin de vie et inutile.
  drift: ^2.34.0

  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # État — providers générés, jamais de constructeur manuel.
  # riverpod_annotation est épinglé pour rester sur la même version d'analyzer
  # que freezed. Voir la note des dev_dependencies.
  flutter_riverpod: ^3.3.0

  # Modèles immuables et unions scellées pour GameEvent.
  freezed_annotation: ^3.1.0

  go_router: ^17.4.0

  # Version épinglée par flutter_localizations, ne pas desserrer.
  intl: 0.20.2
  json_annotation: ^4.12.0
  path: ^1.9.1
  path_provider: ^2.1.6
  riverpod_annotation: 4.0.3
  sqlite3: ^3.5.1

dev_dependencies:
  build_runner: ^2.15.1

  # ATTENTION — ces quatre versions sont solidaires : elles doivent toutes
  # tourner sur la MÊME version d'analyzer, et la seule fenêtre commune
  # entièrement stable aujourd'hui est analyzer 9.
  #
  #   freezed 3.2.5        analyzer >=9  <11
  #   json_serializable    analyzer >=9  <11   (6.13.1+ exige >=10)
  #   riverpod_generator   analyzer ^9         (4.0.4 passe à ^12)
  #   drift_dev 2.31.0     analyzer >=8.1 <11  (2.32+ exige >=10)
  #
  # Conséquence assumée : drift reste en 2.31 et flutter_riverpod en 3.3.1.
  # Ne pas monter une seule de ces lignes isolément, la résolution casse.
  # À remonter en bloc quand freezed 4 (analyzer 13) sera stable — c'est lui
  # qui bloque tout le reste.
  drift_dev: ^2.34.0

  flutter_test:
    sdk: flutter

  freezed: 3.2.6-dev.1
  json_serializable: ^6.13.2
  riverpod_generator: 4.0.4
  very_good_analysis: ^10.3.0

flutter:
  uses-material-design: true

  # Génère les classes de localisation à partir de lib/l10n/*.arb.
  generate: true

  assets:
    - assets/decks/
