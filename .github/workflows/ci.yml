name: CI

on:
  # `feature/lot-*` : un lot trop gros pour une seule PR se découpe en PR
  # chaînées sur une branche d'intégration, qui ne remonte dans `develop` qu'une
  # fois entière. Sans cette ligne, aucune de ces PR ne serait vérifiée et tout
  # le lot arriverait d'un bloc — l'accumulation que docs/ROADMAP.md dit
  # d'éviter. Le runner macOS, lui, reste filtré par le job iOS.
  pull_request:
    branches: [develop, main, 'feature/lot-*']
    # `labeled` : le job iOS se déclenche par une étiquette, et une étiquette
    # posée après coup n'était dans le contexte d'aucun run — il fallait
    # repousser un commit pour qu'elle prenne effet, ce qui vidait le
    # mécanisme de son intérêt. La concurrence annule le run en cours, donc
    # étiqueter ne fait pas tourner deux fois.
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [develop, main]

# Une PR qu'on repousse annule le run précédent : inutile de payer deux fois
# un runner macOS pour un commit déjà remplacé.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.44.9

jobs:
  # Le projet Flutter n'est pas encore scaffoldé (lot 1 de docs/ROADMAP.md).
  # Ce job évite une CI rouge en permanence en attendant, et se neutralise
  # tout seul dès que pubspec.yaml existe.
  scaffolded:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
      code: ${{ steps.portee.outputs.code }}
    steps:
      # `fetch-depth: 2` pour que `HEAD^` existe : c'est ce qui permet à l'étape
      # `portee` de savoir ce que la modification touche.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: check
        run: |
          if [ -f pubspec.yaml ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Projet Flutter pas encore scaffoldé — analyze et test sont sautés."
          fi

      # Une PR qui ne change que de la prose n'a aucune raison de payer un build
      # de release : Gradle et R8 sont le job le plus long de cette CI, et aucun
      # `.md` ne peut les faire changer d'avis. `docs/REPRISE.md` étant mis à
      # jour à chaque unité de travail, ce cas n'a rien d'exceptionnel.
      #
      # `HEAD^` est le bon point de comparaison dans les deux déclencheurs : sur
      # une `pull_request`, GitHub construit un commit de fusion dont le premier
      # parent est la branche visée, donc `HEAD^..HEAD` est exactement le
      # contenu de la PR ; sur un `push`, c'est le commit précédent.
      #
      # Le défaut est de **construire** : une liste vide, une erreur de git, ou
      # un seul fichier qui n'est ni un `.md` ni sous `docs/`, suffit à faire
      # tourner le job. Se tromper en construisant coûte des minutes de runner ;
      # se tromper en sautant laisse passer une régression.
      #
      # Le `|| echo FORCE` n'est pas une ceinture de plus : le shell d'une étape
      # est `bash -e`, où une affectation par substitution qui échoue **tue
      # l'étape**. Un `scaffolded` rouge ne saute pas que le build Android — un
      # `if:` de job sans fonction de statut n'affranchit pas des `needs`, donc
      # `analyze-test` tomberait avec lui. Ce job de garde ne portait aucune
      # logique faillible avant cette étape ; `FORCE` ne matche aucun des deux
      # motifs, donc une panne de git construit au lieu de tout emporter.
      - id: portee
        run: |
          fichiers=$(git diff --name-only HEAD^ HEAD || echo FORCE)
          if [ -z "$fichiers" ] || echo "$fichiers" | grep -qvE '(^docs/|\.md$)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Seuls des documents changent — le build Android est sauté."
          fi

  analyze-test:
    needs: scaffolded
    if: needs.scaffolded.outputs.ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # Rien de généré n'est versionné : ni les classes de localisation, ni le
      # code de freezed, riverpod et drift.
      - name: Localisation
        run: flutter gen-l10n

      - name: Génération de code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Formatage
        run: dart format --output=none --set-exit-if-changed lib test tool

      - name: Analyse statique
        run: flutter analyze --fatal-infos --fatal-warnings

      # Le banc de rendu de `tool/apercus/` n'est pas ici : il vit hors de
      # `test/` précisément pour que ni cette commande ni celle du poste de
      # travail ne le ramassent.
      - name: Tests
        run: flutter test --coverage

      # L'outillage Python ne tourne qu'en atelier, mais un outil dont les
      # tests ne tournent jamais pourrit en silence. Il ne s'agit plus du seul
      # import de contenu : ces tests couvrent aussi les motifs du test de
      # fumée, la parité des variantes de ressources Android et la géométrie
      # des icônes — trois choses que rien d'autre ici ne regarde.
      # Bibliothèque standard uniquement, donc rien à installer.
      - name: Tests de l'outillage
        run: python3 -m unittest discover -s tool -t tool

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: ignore

  # sqlite3 3.x compile ses binaires natifs via les build hooks de Dart. C'est
  # le seul job qui prouve que ça se résout sur Android : sans lui, la
  # déviation par rapport à sqlite3_flutter_libs n'est validée nulle part sur
  # mobile.
  # Sauté quand une **PR** ne touche que de la prose, voir l'étape `portee`.
  # `analyze-test`, lui, tourne toujours — quatre minutes contre une dizaine
  # ici, et c'est le feu vert qu'on regarde avant de merger.
  #
  # Le filtre ne vaut que pour les PR, et c'est délibéré : sur un `push`,
  # `HEAD^` ne montre que le dernier commit, alors que `develop` peut avancer de
  # plusieurs d'un coup — un « Rebase and merge », ou un push direct que rien
  # n'empêche techniquement. Comme une unité de travail finit souvent par un
  # `docs(reprise): …`, la série entière serait classée prose sur la foi de son
  # dernier commit. Le run de `push` reste donc le filet complet.
  #
  # L'étiquette `android` force le job à la main, sur le précédent de `ios` :
  # `labeled` est déjà dans les types de déclenchement, et un filtre sans porte
  # de sortie se contourne sinon à coups de commits vides.
  android-build:
    needs: scaffolded
    if: >-
      needs.scaffolded.outputs.ready == 'true' &&
      (github.event_name != 'pull_request' ||
      needs.scaffolded.outputs.code == 'true' ||
      contains(github.event.pull_request.labels.*.name, 'android'))
    runs-on: ubuntu-latest
    steps:
      # `fetch-depth: 0`, et pas le clone superficiel par défaut. Le
      # `versionCode` est calculé par `android/app/build.gradle.kts` depuis
      # `git rev-list --count HEAD` : à la profondeur 1, ce compte vaut `1`.
      # Ce n'est pas seulement un mauvais numéro sur un artefact que personne
      # ne récupère — c'est que `1` est aussi la valeur de repli, donc la CI
      # serait le seul endroit incapable de distinguer « le comptage marche »
      # de « le comptage est tombé en panne ».
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter gen-l10n
      - run: dart run build_runner build --delete-conflicting-outputs

      - name: Build Android non signé
        run: flutter build apk --debug

      # R8 ne tourne qu'en release, et c'est le plugin Gradle de Flutter qui
      # l'active — pas une option du dépôt. Sans ce job, aucune configuration
      # de `android/app/proguard-rules.pro` n'est jamais évaluée : une règle
      # mal écrite ne se découvre qu'au build de publication.
      #
      # Honnêteté sur ce que ce job **ne** couvre **pas** : R8 ne casse pas le
      # build, il casse l'exécution. Le crash au démarrage du 19 août — un
      # constructeur retiré à une base Room, voir `docs/ROADMAP.md` — sortait
      # d'un build parfaitement vert. Seul `tool/fumee.py`, qui lance
      # l'application sur un vrai téléphone, l'attrape.
      #
      # `GRADLE_OPTS` : `android/gradle.properties` versionne `-Xmx8G`, et le
      # dépôt étant privé, `ubuntu-latest` n'a que 7 Go. Le démon démarrerait
      # — c'est de la réservation virtuelle — mais un tas de R8 qui monte se
      # ferait trancher par l'OOM-killer, et le symptôme est un « Gradle build
      # daemon disappeared unexpectedly » sans rapport avec la PR en cours.
      # L'ajustement se pose ici, pas dans le fichier versionné.
      #
      # `--target-platform` : R8 ne dépend pas de l'ABI, et c'est lui qu'on
      # vient exercer. Compiler l'AOT pour les trois architectures sur deux
      # cœurs triplerait le job sans rien prouver de plus. Le job de debug
      # au-dessus, lui, les construit toutes.
      - name: Build Android de release
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g
        run: flutter build apk --release --target-platform android-arm64

  # Branché dès le lot 1 volontairement : une CI iOS ajoutée tardivement fait
  # remonter d'un coup pods, permissions et signature au pire moment.
  # Voir docs/ROADMAP.md, lot 1.
  #
  # Mais depuis que le dépôt est privé — le contenu des cartes ne doit pas être
  # public — les minutes ne sont plus gratuites, et **un runner macOS compte
  # dix fois**. Ce seul job coûtait plus de quota que les trois autres réunis.
  # Il ne tourne donc plus à chaque PR vers `develop`, mais sur `main` et sur
  # tout ce qui touche à la plateforme iOS : c'est là qu'une régression de
  # pods ou de permissions se paie, et une remontée vers `main` est de toute
  # façon un arbitrage humain qui peut attendre quatre minutes de plus.
  ios-build:
    needs: scaffolded
    if: >-
      needs.scaffolded.outputs.ready == 'true' &&
      (github.ref_name == 'main' ||
       github.base_ref == 'main' ||
       contains(github.event.pull_request.labels.*.name, 'ios'))
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs

      - name: Build iOS non signé
        run: flutter build ios --no-codesign --debug
